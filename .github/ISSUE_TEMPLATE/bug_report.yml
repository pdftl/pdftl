name: Bug Report
description: Something isn't working correctly
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Thanks for taking the time to report a bug!"

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: command
    attributes:
      label: Command that triggered the bug
      description: The exact pdftl command you ran. Attach input pdf file(s) required to reproduce the bug, if possible.
      placeholder: "pdftl in.pdf cat 1-end output out.pdf"
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true

  - type: textarea
    id: version
    attributes:
      label: pdftl version
      description: Run `pdftl --version` and paste the output here
      placeholder: "pdftl 0.14.0 ..."
    validations:
      required: true

  - type: checkboxes
    id: pdf_attach
    attributes:
      label: Can you share the input PDF?
      description: A minimal reproducer PDF dramatically speeds up fixing bugs. Redact sensitive content if needed.
      options:
        - label: I have attached the PDF file required to reproduce the issue (see above)
        - label: The PDF is confidential but I can create a minimal synthetic reproducer (attached above)
        - label: I cannot share the PDF - this makes it much harder to fix the bug

  - type: textarea
    id: debug_output
    attributes:
      label: Debug output
      description: |
        Re-run your command with `--debug` and paste the output here.
        This is very helpful for diagnosing issues.
        Example: `pdftl in.pdf cat 1-end output out.pdf --debug`
      render: shell
    validations:
      required: false
