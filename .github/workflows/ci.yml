name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

env:
  PYTHONUTF8: 1
  PYTHONIOENCODING: "utf-8"

jobs:
  # 1. Primary Language/OS/Architecture Matrix (Native Runners)
  tests:
    name: Tests (${{ matrix.os }} / py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.10"
          - os: ubuntu-latest
            python: "3.11"
          - os: ubuntu-latest
            python: "3.12"
          - os: ubuntu-latest
            python: "3.13"
            coverage: true
          - os: ubuntu-latest
            python: "3.14"
          - os: windows-latest
            python: "3.13"
          - os: macos-latest
            python: "3.13"
          - os: ubuntu-24.04-arm
            python: "3.13"

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0 # Needed for setuptools_scm

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ matrix.python }}

      - name: Install dependencies
        run: pip install -e .[dev-all]

      - name: Run tests
        working-directory: ${{ github.workspace }}
        run: |
            python -X utf8 -m pytest -n auto --dist loadfile ${{ matrix.coverage && matrix.os == 'ubuntu-latest' && '--cov=pdftl --cov-report=xml' || '' }}

      - name: Upload coverage artifact
        if: matrix.coverage && matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: coverage
          path: coverage.xml

  # 2. Linux Distribution Ecosystem Matrix (Containerized Runners, uses system python)
  distro-tests:
    name: Tests (${{ matrix.distro }} / ${{ matrix.arch }})
    runs-on: ubuntu-latest
    container:
      image: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: Arch Linux (Rolling)
            image: archlinux:latest
            arch: x86_64
            setup: pacman -Syu --noconfirm python python-pip git gcc

          - distro: Fedora (RPM Ecosystem)
            image: fedora:latest
            arch: x86_64
            setup: |
              dnf install -y python3 python3-pip git gcc

    steps:
      # 1. Install git (and other system prereqs) FIRST
      - name: Install system dependencies
        run: ${{ matrix.setup }}

      # 2. NOW checkout the code, using the newly installed git
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0 # Needed for setuptools_scm

      # 3. Pip install smoothly with full git metadata intact
      - name: Install Python dependencies
        run: |
          git config --global --add safe.directory '*'
          python3 -m pip install --break-system-packages -e .[dev-all]

      - name: Run tests
        run: python3 -X utf8 -m pytest -n auto --dist loadfile

  # 3. Compatibility Test Suite
  phptests:
    name: php-pdftk test suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0 # Needed for setuptools_scm

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e .[dev-all]

      - name: Install php prereqs
        run: bash tools/install_php_ci_prereqs.sh

      - name: Setup php tests
        run: bash tools/setup_php_tests.sh

      - name: Run php-pdftk test suite via pytest
        run: pytest tests/test_php_compat.py

  # 4. Coverage Publisher
  codecov:
    name: Upload coverage (Linux 3.13)
    needs: tests
    runs-on: ubuntu-latest
    if: success()
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Download coverage artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: coverage

      - name: Upload to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f
        with:
          files: coverage.xml
