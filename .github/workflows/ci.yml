name: CI

on:
  push:
    branches: ["main"]
  pull_request:

env:
  PYTHONUTF8: 1
  PYTHONIOENCODING: "utf-8"

jobs:
  tests:
    name: Tests (${{ matrix.os }} / py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.10"
          - os: ubuntu-latest
            python: "3.11"
          - os: ubuntu-latest
            python: "3.12"
          - os: ubuntu-latest
            python: "3.13"
            coverage: true
          - os: ubuntu-latest
            python: "3.14"
          - os: windows-latest
            python: "3.13"
          - os: macos-latest
            python: "3.13"

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}

      - name: Install dependencies
        run: pip install -e .[dev-all]

      - name: Generate stubs
        run: python tools/api_stub_gen.py

      - name: Run tests
        working-directory: ${{ github.workspace }}
        run: |
            # Always run in parallel (-n auto), only run coverage on one Linux job
            python -X utf8 -m pytest -n auto --dist loadfile ${{ matrix.coverage && matrix.os == 'ubuntu-latest' && '--cov=pdftl --cov-report=xml' || '' }}

      - name: Upload coverage artifact
        if: matrix.coverage && matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: coverage
          path: coverage.xml

  phptests:
    name: php-pdftk test suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e .[dev-all]

      - name: Install php prereqs
        run: bash tools/install_php_ci_prereqs.sh

      - name: Setup php tests
        run: bash tools/setup_php_tests.sh

      - name: Run php-pdftk test suite via pytest
        run: pytest tests/test_php_compat.py

  codecov:
    name: Upload coverage (Linux 3.13)
    needs: tests
    runs-on: ubuntu-latest
    if: success()
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Download coverage artifact
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: coverage

      - name: Upload to Codecov
        uses: codecov/codecov-action@671740ac38dd9b0130fbe1cec585b89eea48d3de
        with:
          files: coverage.xml
