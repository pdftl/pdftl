name: Publish to PyPI (and ping RTD)

on:
  push:
    tags:
      - "v*"  # Triggers on tags like v0.1.0, v1.0, etc.

jobs:
  pypi-publish:
    name: Upload release to PyPI
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # IMPORTANT: Required for trusted publishing
      contents: read

    steps:
    - name: Checkout code
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      with:
        fetch-depth: 0  # get all tags, for dynamic versioning

    - name: Set up Python
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
      with:
        python-version: "3.10"

    - name: Install build tools
      run: |
        python -m pip install --upgrade pip
        pip install build

    - name: Build package
      run: python -m build

    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b

  rtd-sync:
    needs: pypi-publish
    uses: ./.github/workflows/rtd_rebuild.yml
    permissions:
      contents: read
    secrets: inherit
