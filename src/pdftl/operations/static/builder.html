<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<!-- Mobile viewport meta tag -->
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>pdftl pipeline builder</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --border: #2a2e38;
    --text: #e6e8eb;
    --muted: #8a8f9a;
    --accent: #5b8cff;
    --accent-hover: #7aa0ff;
    --danger: #ff5b5b;
    --mono: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 24px 16px 80px;
    min-height: 100vh;
  }

  /* Full-page drag overlay */
  body.dragover::after {
    content: "Drop PDFs anywhere to upload";
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(15, 17, 21, 0.9);
    border: 4px dashed var(--accent);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    font-weight: 600;
    color: var(--accent);
    z-index: 9999;
    pointer-events: none; /* Let events pass through so drop registers on body */
  }

  .wrap { max-width: 880px; margin: 0 auto; }
  h1 { font-size: 22px; margin-bottom: 4px; }
  .sub { color: var(--muted); font-size: 14px; margin-bottom: 28px; line-height: 1.4; }
  .sub code { color: var(--accent); word-break: break-all; }

  section {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 20px;
    margin-bottom: 20px;
  }
  section h2 {
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--muted);
    margin: 0 0 14px;
  }

  /* Clickable drop zone for mobile / manual browsing */
  #dropZone {
    border: 2px dashed var(--border);
    border-radius: 8px;
    padding: 24px 16px;
    text-align: center;
    color: var(--muted);
    transition: all 0.2s ease;
    cursor: pointer;
    font-size: 14px;
  }
  #dropZone:hover {
    border-color: var(--accent);
    background: rgba(91, 140, 255, 0.05);
  }
  #dropZone span { color: var(--accent); font-weight: 600; }
  #fileInput { display: none; }

  .files-list { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .file-chip {
    background: #202531;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 6px 10px;
    font-size: 13px;
    display: flex;
    align-items: center;
    gap: 8px;
    max-width: 100%;
  }
  .file-chip input.handleInput {
    background: transparent;
    border: none;
    border-bottom: 1px dashed var(--accent);
    color: var(--accent);
    font-family: var(--mono);
    font-size: 13px;
    font-weight: bold;
    width: 28px;
    padding: 0;
    margin: 0;
    text-align: center;
    text-transform: uppercase;
    outline: none;
  }
  .file-chip span {
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .file-chip button {
    background: none;
    border: none;
    color: var(--danger);
    cursor: pointer;
    font-size: 13px;
    padding: 0 4px;
    margin-left: auto;
  }

  .op-row {
    display: flex;
    gap: 8px;
    margin-bottom: 4px;
  }
  select, input[type=text], textarea {
    background: #202531;
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 6px;
    padding: 10px;
    font-size: 14px;
    font-family: inherit;
  }
  select { flex: 1; min-width: 0; }
  .op-desc {
    color: var(--muted); font-size: 12px; margin: 6px 0 14px; min-height: 16px; line-height: 1.4;
  }
  .op-desc code { color: var(--accent); font-family: var(--mono); }

  button.primary {
    background: var(--accent);
    border: none;
    color: #fff;
    padding: 10px 16px;
    border-radius: 6px;
    font-size: 14px;
    cursor: pointer;
    font-weight: 600;
  }
  button.primary:hover { background: var(--accent-hover); }

  button.secondary {
    background: #202531;
    border: 1px solid var(--border);
    color: var(--text);
    padding: 10px 16px;
    border-radius: 6px;
    font-size: 14px;
    cursor: pointer;
    font-weight: 600;
    transition: all 0.2s ease;
  }
  button.secondary:hover {
    background: #2a2e38;
    border-color: var(--muted);
  }

  ol#stepList {
   list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px;
  }
  .step {
    background: #0f1115;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px;
  }
  .step-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 8px;
  }
  .step-head select.stepOpSelect {
    padding: 4px 8px;
    font-size: 13px;
    font-family: var(--mono);
    background: #202531;
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 4px;
    outline: none;
  }
  .step-head .badge {
    background: var(--accent);
    color: #fff;
    font-size: 11px;
    font-weight: 700;
    border-radius: 4px;
    padding: 2px 7px;
    margin-right: 8px;
  }
  .step-head .opname { font-family: var(--mono); font-size: 13px; word-break: break-all; }
  .step-controls { display: flex; gap: 4px; }
  .step-controls button {
    background: none;
    border: none;
    color: var(--muted);
    cursor: pointer;
    font-size: 16px;
    padding: 4px 8px;
  }
  .step-controls button:hover { color: var(--text); }
  .step-controls button.remove:hover { color: var(--danger); }
  .step input[type=text] { width: 100%; font-family: var(--mono); }
  .step .hint { color: var(--muted); font-size: 11px; margin-top: 6px; line-height: 1.3; }

  .empty { color: var(--muted); font-size: 13px; font-style: italic; }
  #runBtn { width: 100%; padding: 14px; font-size: 15px; }
  #runBtn:disabled { opacity: 0.5; cursor: not-allowed; }

  .rtd-link {
    background: #1c3a2a;
    color: #6be89a;
  }

  #result { margin-top: 16px; font-size: 13px; }
  #result a {
    display: block;
    text-align: center;
    background: #1c3a2a;
    color: #6be89a;
    border: 1px solid #2e5a41;
    padding: 12px 14px;
    border-radius: 6px;
    text-decoration: none;
    font-weight: 600;
  }
  #result .error {
    background: #3a1c1c;
    color: #ff9d9d;
    border: 1px solid #5a2e2e;
    padding: 12px 14px;
    border-radius: 6px;
    font-family: var(--mono);
    white-space: pre-wrap;
    word-break: break-word;
    overflow-x: auto;
  }
  #result pre {
    background: #0f1115;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 12px;
    overflow-x: auto;
    font-size: 12px;
    position: relative;
  }
  .result-json-wrap {
    position: relative;
    display: block;
  }
  .copy-json-btn {
    position: absolute;
    top: 8px;
    right: 8px;
    background: #2a2e38;
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 4px;
    padding: 4px 10px;
    font-size: 11px;
    cursor: pointer;
    z-index: 5;
    transition: all 0.2s ease;
  }
  .copy-json-btn:hover {
    color: var(--text);
    border-color: var(--accent);
    background: #333947;
  }
  .status-line { font-size: 13px; color: var(--muted); margin-top: 12px; text-align: center; }
  .status-line.ok { color: #6be89a; }
  .status-line.err { color: var(--danger); }

  @media (max-width: 480px) {
    .op-row { flex-direction: column; }
    .op-row button { width: 100%; }
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>pdftl pipeline builder</h1>
  <div class="sub">Talks directly to <code id="apiBase"></code>. Connect operations, run.</div>

  <section>
    <h2>1. Upload PDFs</h2>
    <div id="dropZone">
      Drag & drop PDFs here or <span>browse files</span>
      <input type="file" id="fileInput" accept="application/pdf" multiple>
    </div>
    <div class="files-list" id="filesList"></div>
  </section>

  <section>
    <h2>2. Build pipeline</h2>
    <ol id="stepList"></ol>
    <div class="empty" id="emptyHint" style="margin-top: 12px; display: none;">No steps yet —
      click below to add a step.</div>
    <div style="margin-top: 16px;">
      <button class="primary" id="addStepBtn" type="button">+ Add step</button>
    </div>
  </section>

  <section>
    <h2>3. Run</h2>
    <div style="display: flex; gap: 10px; margin-top: 4px;">
      <button class="primary" id="runBtn" type="button" disabled style="flex: 1;">Run
	pipeline</button>
      <button 
	class="secondary" 
	id="shareBtn" 
	type="button" 
	title="Copy shareable link for this pipeline">🔗 Copy link</button>
    </div>
    <div class="status-line" id="statusLine"></div>
    <div id="result"></div>
  </section>
</div>

<script>
const params = new URLSearchParams(location.search);
//const API = params.get('api') || location.origin;
//const API = (location.origin === "null") ? "http://localhost:4080" : location.origin;
const API = (location.protocol === 'file:' || location.origin === 'null') 
  ? 'http://localhost:4080' 
  : location.origin;
document.getElementById('apiBase').textContent = API;

let opsMeta = {};
let opNames = [];

function escapeHtml(str) {
  if (!str) return '';
  return str
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

const nextHandle = () => {
  const existing = Array.from(
      document.querySelectorAll('.handleInput')
  ).map(i => i.value.trim().toUpperCase());
  for (let i = 0; i < 26; i++) {
    const char = String.fromCharCode(65 + i);
    if (!existing.includes(char)) {
      return char;
    }
  }
  return 'A';
};

function processFiles(files) {
  const box = document.getElementById('filesList');
  [...files].forEach(f => {
    if (f.type !== "application/pdf") return;
    const chip = document.createElement('div');
    chip.className = 'file-chip';
    const initialHandle = nextHandle();
    chip.innerHTML = `
      📄 <input type="text" class="handleInput" 
          value="${escapeHtml(initialHandle)}" maxlength="1" spellcheck="false" autocomplete="off">
      <span style="color:var(--muted)" title="${escapeHtml(f.name)}">${escapeHtml(f.name)}</span>
      <button class="removeFile" type="button" title="Remove">✕</button>
    `;
    chip._file = f;

    const input = chip.querySelector('.handleInput');
    input.addEventListener('input', e => {
      let val = e.target.value.toUpperCase().replace(/[^A-Z]/g, '');
      if (val.length > 1) val = val[0];
      e.target.value = val;
      updateStepLayout();
    });

    box.appendChild(chip);
  });
  document.getElementById('fileInput').value = '';
  updateStepLayout();
}

// Full-page drag and drop handling
let dragCounter = 0;

document.body.addEventListener('dragenter', e => {
  e.preventDefault();
  dragCounter++;
  document.body.classList.add('dragover');
});

document.body.addEventListener('dragover', e => {
  e.preventDefault();
});

document.body.addEventListener('dragleave', e => {
  dragCounter--;
  if (dragCounter === 0) {
    document.body.classList.remove('dragover');
  }
});

document.body.addEventListener('drop', e => {
  e.preventDefault();
  dragCounter = 0;
  document.body.classList.remove('dragover');
  if (e.dataTransfer && e.dataTransfer.files) {
    processFiles(e.dataTransfer.files);
  }
});

// Click to browse handling
document.getElementById('dropZone').addEventListener('click', () => {
  document.getElementById('fileInput').click();
});
document.getElementById('fileInput').addEventListener('change', e => {
  processFiles(e.target.files);
});

// File removal
document.getElementById('filesList').addEventListener('click', e => {
  const btn = e.target.closest('.removeFile');
  if (btn) {
    btn.closest('.file-chip').remove();
    updateStepLayout();
  }
});

function formatDisplayInputs(val) {
  if (!val) return '';
  try {
    const parsed = JSON.parse(val);
    if (Array.isArray(parsed)) return parsed.join(', ');
  } catch(e) {}
  return val;
}

function addStepToDOM(name, argsValue = '', inputsValue = '') {
  const list = document.getElementById('stepList');
  const meta = opsMeta[name] || {};
  const li = document.createElement('li');
  li.className = 'step';
  li.dataset.operation = name;

  const stepsCount = list.querySelectorAll('.step').length;
  let defaultInputs = formatDisplayInputs(inputsValue);
  if (!defaultInputs) {
    if (stepsCount === 0) {
      const handles = Array.from(document.querySelectorAll('.handleInput'))
        .map(i => i.value.trim().toUpperCase())
        .filter(Boolean);
      defaultInputs = handles.join(', ');
    } else {
      defaultInputs = '_';
    }
  }

  li.innerHTML = `
    <div class="step-head">
      <div style="display:flex; align-items:center; gap: 8px;">
        <span class="badge step-num"></span>
        <select class="stepOpSelect"></select>
        <span class="rtd-link-container"></span>
      </div>
      <div class="step-controls">
        <button class="moveUp" type="button" title="Move up">↑</button>
        <button class="moveDown" type="button" title="Move down">↓</button>
        <button class="remove" type="button" title="Remove">✕</button>
      </div>
    </div>

    <!-- Restored Description Field -->
    <div class="op-desc" style="margin: 0 0 10px 0; min-height: 0;"></div>

    <div style="display: flex; gap: 8px; margin-bottom: 6px;">
      <div style="flex: 1;">
        <label style="display:block; font-size: 11px; color: var(--muted); 
         margin-bottom: 2px;">Inputs</label>
        <input type="text" class="stepInputsInput" value="${escapeHtml(defaultInputs)}" 
         placeholder="e.g. A, B or _" spellcheck="false" autocomplete="off" style="padding: 8px;">
      </div>
      <div style="flex: 2;">
        <label style="display:block; font-size: 11px; color: var(--muted); 
         margin-bottom: 2px;">Arguments (args)</label>
        <input type="text" class="argsInput" placeholder="e.g., 1-3 or right or @B" 
         spellcheck="false" autocomplete="off" style="padding: 8px;">
      </div>
    </div>

    <div class="hint"></div>
  `;

  if (argsValue) {
    li.querySelector('.argsInput').value = argsValue;
  }

  if (inputsValue) {
    li.querySelector('.stepInputsInput').dataset.touched = 'true';
  }

  const stepInputsInput = li.querySelector('.stepInputsInput');

  // Real-time filter: Force uppercase, only allow A-Z, underscore, comma, and spaces
  stepInputsInput.addEventListener('input', e => {
    let val = e.target.value.toUpperCase().replace(/[^A-Z_,\s]/g, '');
    e.target.value = val;

    if (val.trim() === '') {
      delete e.target.dataset.touched;
      updateStepLayout();
    } else {
      e.target.dataset.touched = 'true';
    }
  });

  // Strict split-clean on loss of focus: translates "A,,,B C" into "A, B, C"
  stepInputsInput.addEventListener('blur', e => {
    let val = e.target.value;
    let singleChars = val.match(/[A-Z_]/g);
    if (singleChars) {
      e.target.value = singleChars.join(', ');
    } else {
      e.target.value = '';
      delete e.target.dataset.touched;
      updateStepLayout();
    }
  });

  // Populate dynamic inline select dropdown
  const selectEl = li.querySelector('.stepOpSelect');
  selectEl.innerHTML = opNames.map(n => 
      `<option value="${escapeHtml(n)}" ${n === name ? 'selected' : ''}>${escapeHtml(n)}</option>`
  ).join('');

  // Update logic on operation dropdown change
  const updateStepHelpAndHint = () => {
    const selectedOp = selectEl.value;
    li.dataset.operation = selectedOp;

    // Help link
    const rtdContainer = li.querySelector('.rtd-link-container');
    if (rtdContainer) {
      rtdContainer.innerHTML = rtdLink(selectedOp);
    }

    const selectedMeta = opsMeta[selectedOp] || {};

    // Populating Restored Description
    const descEl = li.querySelector('.op-desc');
    if (descEl) {
      descEl.textContent = selectedMeta.description || selectedMeta.desc || '';
    }

    // Usage Hint
    const hintEl = li.querySelector('.hint');
    if (hintEl) {
      hintEl.textContent = selectedMeta.usage || '';
    }
  };

  selectEl.addEventListener('change', updateStepHelpAndHint);
  updateStepHelpAndHint();

  list.appendChild(li);
  updateStepLayout();
}

async function loadOps() {
  try {
    const resp = await fetch(`${API}/v1/status`);
    if (!resp.ok) throw new Error("API not reachable");
    const data = await resp.json();
    opsMeta = data.operations || {};
    opNames = Object.keys(opsMeta).sort();

    parseUrlPipeline();

    // Start with exactly one stage ("cat" by default) if none loaded from URL
    const list = document.getElementById('stepList');
    if (list.querySelectorAll('.step').length === 0 && opNames.length > 0) {
      const defaultOp = opNames.includes('cat') ? 'cat' : opNames[0];
      addStepToDOM(defaultOp);
    }
  } catch (e) {
    setStatus("Warning: Could not connect to API to load operations.", "err");
  }
}

function rtdLink(name) {
  return `<a class="rtd-link" 
           href="https://pdftl.readthedocs.io/en/latest/operations/${name}.html" 
           target="_blank">help</a>`;
}

function parseUrlPipeline() {
  let maxStep = 0;

  // Find the highest step number specified in the URL params
  for (const key of params.keys()) {
    const match = key.match(/^op(\d+)$/);
    if (match) {
      const num = parseInt(match[1], 10);
      if (num > maxStep) {
        maxStep = num;
      }
    }
  }

  // Iterate up to the max step, backfilling any gaps with 'filter'
  for (let i = 1; i <= maxStep; i++) {
    let op = params.get(`op${i}`);
    const args = params.get(`args${i}`) || params.get(`arg${i}`) || '';
    const inputs = params.get(`inputs${i}`) || params.get(`input${i}`) || params.get(`in${i}`) || '';

    if (!op) {
      op = 'filter';
    }

    if (opsMeta[op]) {
      addStepToDOM(op, args, inputs);
    } else {
      // Safe fallback in case 'filter' or the specified op isn't supported by the loaded API
      const fallback = opsMeta['filter'] ? 'filter' : (opNames[0] || 'cat');
      addStepToDOM(fallback, args, inputs);
      console.warn(`Operation "${op}" is not supported by this API. Defaulted to "${fallback}".`);
    }
  }
}

function updateStepLayout() {
  const list = document.getElementById('stepList');
  const steps = list.querySelectorAll('.step');

  document.getElementById('emptyHint').style.display = steps.length ? 'none' : 'block';
  updateRunEnabled();

  const handles = Array.from(document.querySelectorAll('.handleInput'))
    .map(i => i.value.trim().toUpperCase())
    .filter(Boolean);

  steps.forEach((step, i) => {
    step.querySelector('.step-num').textContent = i + 1;
    step.querySelector('.moveUp').style.display = i === 0 ? 'none' : 'inline-block';
    step.querySelector('.moveDown').style.display = 
	  i === steps.length - 1 ? 'none' : 'inline-block';

    const inputEl = step.querySelector('.stepInputsInput');
    if (inputEl && !inputEl.dataset.touched) {
      if (i === 0) {
        inputEl.value = handles.join(', ');
      } else {
        inputEl.value = '_';
      }
    }
  });
}

function updateRunEnabled() {
  const stepCount = document.querySelectorAll('#stepList .step').length;
  document.getElementById('runBtn').disabled = stepCount === 0;
}

function setStatus(msg, cls) {
  const el = document.getElementById('statusLine');
  el.textContent = msg;
  el.className = 'status-line' + (cls ? ' ' + cls : '');
}

function parseListField(text) {
  const t = text.trim();
  if (!t) return [];
  try {
    const v = JSON.parse(t);
    if (Array.isArray(v)) return v;
  } catch (e) { /* fall through */ }
  return t.split(',').map(s => s.trim()).filter(Boolean);
}

document.getElementById('addStepBtn').addEventListener('click', () => {
  const defaultOp = opNames.includes('cat') ? 'cat' : (opNames[0] || 'cat');
  addStepToDOM(defaultOp);
});

document.getElementById('stepList').addEventListener('click', e => {
  const btn = e.target.closest('button');
  if (!btn) return;

  const li = btn.closest('.step');
  if (!li) return;

  if (btn.classList.contains('remove')) {
    li.remove();
  } else if (btn.classList.contains('moveUp')) {
    const prev = li.previousElementSibling;
    if (prev) li.parentNode.insertBefore(li, prev);
  } else if (btn.classList.contains('moveDown')) {
    const next = li.nextElementSibling;
    if (next) li.parentNode.insertBefore(li, next);
  }
  updateStepLayout();
});

// Reconstruct pipeline configurations into a clean shareable URL
function generatePipelineUrl() {
  const newParams = new URLSearchParams();
  const originalApi = params.get('api');
  if (originalApi) {
    newParams.set('api', originalApi);
  }

  const steps = document.querySelectorAll('#stepList .step');
  steps.forEach((stepEl, idx) => {
    const i = idx + 1;
    const op = stepEl.dataset.operation;
    const args = stepEl.querySelector('.argsInput').value.trim();
    const inputs = stepEl.querySelector('.stepInputsInput').value.trim();

    newParams.set(`op${i}`, op);
    if (args) {
      newParams.set(`args${i}`, args);
    }
    if (inputs) {
      newParams.set(`inputs${i}`, inputs);
    }
  });

  return `${window.location.origin}${window.location.pathname}?${newParams.toString()}`;
}

// Share button handling
document.getElementById('shareBtn').addEventListener('click', async () => {
  const url = generatePipelineUrl();
  try {
    await navigator.clipboard.writeText(url);
    const btn = document.getElementById('shareBtn');
    const origText = btn.textContent;
    btn.textContent = '✓ Copied!';
    btn.style.borderColor = 'var(--accent)';
    setTimeout(() => {
      btn.textContent = origText;
      btn.style.borderColor = 'var(--border)';
    }, 2000);
  } catch (err) {
    alert('Failed to copy shareable link: ' + err);
  }
});

document.getElementById('runBtn').addEventListener('click', async () => {
  setStatus('Running pipeline…');
  const resultBox = document.getElementById('result');
  resultBox.innerHTML = '';
  document.getElementById('runBtn').disabled = true;

  try {
    const steps = document.querySelectorAll('#stepList .step');
    const pipelineSteps = Array.from(steps).map(stepEl => {
      const operation = stepEl.dataset.operation;
      const argsText = stepEl.querySelector('.argsInput').value;
      const inputsText = stepEl.querySelector('.stepInputsInput').value;
      return {
        operation,
        args: parseListField(argsText),
        inputs: parseListField(inputsText)
      };
    });

    const formData = new FormData();
    formData.append('args', JSON.stringify(pipelineSteps));

    const fileChips = document.querySelectorAll('#filesList .file-chip');
    fileChips.forEach(chip => {
      const handle = chip.querySelector('.handleInput').value.trim().toUpperCase();
      const file = chip._file;
      if (file && handle) {
        formData.append(handle, file, file.name);
      }
    });

    const resp = await fetch(`${API}/v1/execute/pipeline`, { method: 'POST', body: formData });
    const contentType = resp.headers.get('Content-Type') || '';

    if (!resp.ok) {
      let msg = `HTTP ${resp.status}`;
      try {
        const err = await resp.json();
        msg = err.error || JSON.stringify(err);
      } catch (e) {
        msg = await resp.text();
      }

      const errDiv = document.createElement('div');
      errDiv.className = 'error';
      errDiv.textContent = msg;
      resultBox.appendChild(errDiv);
      setStatus('Failed', 'err');
      return;
    }

    if (contentType.includes('application/pdf')) {
      const blob = await resp.blob();
      const url = URL.createObjectURL(blob);

      // 1. Keep the manual green download link in #result
      const link = document.createElement('a');
      link.href = url;
      link.download = 'pdftl_output.pdf';
      link.textContent = '⬇ Download result.pdf';
      resultBox.appendChild(link);

      // 2. Robust auto-trigger using a temporary body-attached anchor helper
      try {
        const downloadHelper = document.createElement('a');
        downloadHelper.href = url;
        downloadHelper.download = 'pdftl_output.pdf';
        downloadHelper.style.display = 'none';
        document.body.appendChild(downloadHelper);
        downloadHelper.click();
        document.body.removeChild(downloadHelper);
      } catch (downloadErr) {
        console.error("Auto-download context blocked. Fall back to manual click.", downloadErr);
      }

    } else if (contentType.includes('application/zip')) {
      const blob = await resp.blob();
      const url = URL.createObjectURL(blob);

      // Try to recover the server's suggested filename from
      // Content-Disposition (falls back to a generic name).
      const disposition = resp.headers.get('Content-Disposition') || '';
      const match = disposition.match(/filename="?([^"]+)"?/);
      const filename = match ? match[1] : 'pdftl_output.zip';

      const link = document.createElement('a');
      link.href = url;
      link.download = filename;
      link.textContent = `⬇ Download ${filename}`;
      resultBox.appendChild(link);

      try {
        const downloadHelper = document.createElement('a');
        downloadHelper.href = url;
        downloadHelper.download = filename;
        downloadHelper.style.display = 'none';
        document.body.appendChild(downloadHelper);
        downloadHelper.click();
        document.body.removeChild(downloadHelper);
      } catch (downloadErr) {
        console.error("Auto-download context blocked. Fall back to manual click.", downloadErr);
      }

    } else if (contentType.includes('application/json')) {
      const data = await resp.json();
      const jsonText = JSON.stringify(data, null, 2);

      const wrap = document.createElement('div');
      wrap.className = 'result-json-wrap';

      const copyBtn = document.createElement('button');
      copyBtn.type = 'button';
      copyBtn.className = 'copy-json-btn';
      copyBtn.textContent = '📋 Copy';
      copyBtn.addEventListener('click', async () => {
        try {
          await navigator.clipboard.writeText(jsonText);
          const origText = copyBtn.textContent;
          copyBtn.textContent = '✓ Copied';
          setTimeout(() => { copyBtn.textContent = origText; }, 1500);
        } catch (err) {
          alert('Failed to copy: ' + err);
        }
      });

      const pre = document.createElement('pre');
      pre.textContent = jsonText;

      wrap.appendChild(pre);
      wrap.appendChild(copyBtn);
      resultBox.appendChild(wrap);

    } else {
      const text = await resp.text();

      const wrap = document.createElement('div');
      wrap.className = 'result-json-wrap';

      const copyBtn = document.createElement('button');
      copyBtn.type = 'button';
      copyBtn.className = 'copy-json-btn';
      copyBtn.textContent = '📋 Copy';
      copyBtn.addEventListener('click', async () => {
        try {
          await navigator.clipboard.writeText(text);
          const origText = copyBtn.textContent;
          copyBtn.textContent = '✓ Copied';
          setTimeout(() => { copyBtn.textContent = origText; }, 1500);
        } catch (err) {
          alert('Failed to copy: ' + err);
        }
      });

      const pre = document.createElement('pre');
      pre.textContent = text;

      wrap.appendChild(pre);
      wrap.appendChild(copyBtn);
      resultBox.appendChild(wrap);
    }
    setStatus('Done', 'ok');
  } catch (e) {
    setStatus('Failed', 'err');
    const errDiv = document.createElement('div');
    errDiv.className = 'error';
    errDiv.textContent = e.message;
    resultBox.appendChild(errDiv);
  } finally {
    updateRunEnabled();
  }
});

loadOps();
</script>
</body>
</html>
